name: Build and Publish Packages

on:
  push:
    branches: [platform-deno]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".gitea/workflows/publish.yaml"
  workflow_dispatch:

env:
  REGISTRY_URL: https://gitea.nupaas.com/api/packages/type-driven/npm/

jobs:
  publish:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare for publish
        run: |
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
          find packages -name package.json -exec sed -i '/"provenance": true,\?/d' {} +

      - name: Build
        run: pnpm codemod && pnpm build

      - name: Publish to Gitea registry
        run: |
          set -euo pipefail
          REGISTRY="${{ env.REGISTRY_URL }}"
          TOKEN="${{ secrets.NPM_PUBLISH_TOKEN }}"

          printf '%s\n' \
            "registry=${REGISTRY}" \
            "@effect:registry=${REGISTRY}" \
            "//gitea.nupaas.com/api/packages/type-driven/npm/:_authToken=${TOKEN}" \
            > ~/.npmrc

          publish_pkg() {
            local dir="$1"
            echo "--- Publishing $dir ---"
            cd "$dir"
            npm publish --registry "$REGISTRY" --no-git-checks 2>&1 \
              && echo "Published $dir" \
              || echo "Skipped $dir (already published or error)"
            cd -
          }

          for dir in packages/effect \
                     packages/platform-node-shared \
                     packages/platform-node \
                     packages/platform-deno \
                     packages/platform-bun \
                     packages/platform-browser \
                     packages/opentelemetry \
                     packages/vitest \
                     packages/ai/anthropic \
                     packages/ai/openai \
                     packages/ai/openai-compat \
                     packages/ai/openrouter \
                     packages/sql/pg \
                     packages/sql/libsql \
                     packages/sql/sqlite-node \
                     packages/sql/mysql2 \
                     packages/sql/mssql \
                     packages/sql/clickhouse; do
            publish_pkg "$dir"
          done
