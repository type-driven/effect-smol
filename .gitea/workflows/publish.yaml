name: Build and Publish Packages

on:
  push:
    branches: [platform-deno]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".gitea/workflows/publish.yaml"
  workflow_dispatch:

env:
  REGISTRY_URL: https://gitea.nupaas.com/api/packages/type-driven/npm/

jobs:
  publish:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure npm registry
        run: |
          printf '%s\n' \
            "//gitea.nupaas.com/api/packages/type-driven/npm/:_authToken=${{ secrets.NPM_PUBLISH_TOKEN }}" \
            >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare for publish
        run: |
          # Strip internals from declarations (matches upstream release flow)
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
          # Remove provenance (GitHub OIDC only, not supported on Gitea)
          find packages -name package.json -exec sed -i '/"provenance": true,\?/d' {} +

      - name: Build
        run: pnpm codemod && pnpm build

      - name: Publish to Gitea registry
        run: |
          printf '%s\n' "registry=${{ env.REGISTRY_URL }}" >> ~/.npmrc
          pnpm changeset publish
